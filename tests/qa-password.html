<!doctype html><html lang="en"><meta charset="utf-8"><title>Password account integration QA</title><style>body{margin:0;background:#dbe4eb;font:14px system-ui}header{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:9px 14px;border-radius:10px;border:1px solid #9eb4c3;background:white}pre{padding:10px 20px;white-space:pre-wrap}iframe{display:block;border:0;background:white;box-shadow:0 3px 20px #16313b20}</style><header><strong>LOCAL QA · real email/password API</strong><button id="run">Run API checks</button><button id="ui-create">Test UI account flow</button><button id="login">Show login</button><button id="admin">Show admin</button><button id="user">Show user</button><label>Viewport <select id="viewport"><option>390</option><option>768</option><option selected>1071</option><option>1440</option></select></label></header><pre id="out">Ready</pre><iframe id="preview" title="PDUK-Radar actual app" width="1071" height="1200"></iframe><script type="module">
const out=document.querySelector('#out'),frame=document.querySelector('#preview'),width=+(new URLSearchParams(location.search).get('width')||1071);frame.width=width;document.querySelector('#viewport').value=String(width);document.querySelector('#viewport').onchange=e=>frame.width=+e.target.value;
async function request(path,method='GET',body,headers={}){const response=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json',...headers},...(body!==undefined?{body:JSON.stringify(body)}:{})});let data;try{data=await response.json()}catch{}return {status:response.status,data};}
const logout=()=>request('/api/auth/logout','POST',{});
const login=role=>request('/api/auth/login','POST',{email:role+'@gmail.com',password:role+'123'});
const checks=[];function check(name,ok){checks.push({name,passed:!!ok});out.textContent=JSON.stringify({passed:checks.filter(x=>x.passed).length,total:checks.length,checks},null,2);if(!ok)throw Error(name);}
document.querySelector('#run').onclick=async()=>{checks.length=0;out.textContent='Running';try{
await logout();check('Anonymous session denied',(await request('/api/session')).status===401);check('Anonymous dataset denied',(await request('/api/data/employers.json')).status===401);check('Anonymous user list denied',(await request('/api/users')).status===401);
check('ChatGPT identity headers alone cannot authenticate',(await request('/api/session','GET',undefined,{'x-chatgpt-account-id':'untrusted-test','x-chatgpt-account-email':'admin@gmail.com'})).status===401);
check('Incorrect password rejected',(await request('/api/auth/login','POST',{email:'admin@gmail.com',password:'incorrect-qa-password'})).status===401);
check('Admin testing account logs in',(await login('admin')).data?.user?.role==='admin');check('Session persists on a later request',(await request('/api/session')).data?.user?.email==='admin@gmail.com');
const list=await request('/api/users');check('Admin sees users including both testing accounts',list.status===200&&list.data.users.some(u=>u.email==='user@gmail.com')&&list.data.users.some(u=>u.email==='admin@gmail.com'));check('Password hashes and session tokens are not exposed',!JSON.stringify(list.data).match(/passwordHash|password_hash|tokenHash|token_hash/));
const email='qa-password-'+Date.now()+'@example.test',password='QA-created-'+Math.random().toString(36).slice(2);const body={name:'QA Created User',email,password};const created=await request('/api/users','POST',body);const id=created.data?.user?.id;check('Admin creates a new user with a password',created.status===201&&created.data.user.role==='user');
check('Duplicate email rejected',(await request('/api/users','POST',body)).status===409);check('Role escalation rejected',(await request('/api/users','POST',{...body,email:'qa-admin-'+Date.now()+'@example.test',role:'admin'})).status===400);check('Password required for new accounts',(await request('/api/users','POST',{name:'Missing Password',email:'missing@example.test'})).status===400);check('Non-JSON mutation rejected',(await request('/api/users','POST',body,{'Content-Type':'text/plain'})).status===415);
await logout();check('Logout invalidates current session',(await request('/api/session')).status===401);
check('Newly created user can log in',(await request('/api/auth/login','POST',{email,password})).data?.user?.id===id);check('User cannot list accounts',(await request('/api/users')).status===403);check('User cannot create accounts',(await request('/api/users','POST',body)).status===403);check('User cannot change account status',(await request('/api/users/'+id,'PATCH',{status:'inactive'})).status===403);check('User gets protected dataset',(await request('/api/data/employers.json')).status===200);check('Non-whitelisted dataset rejected',(await request('/api/data/password.json')).status===404);
await login('admin');check('Admin deactivates user',(await request('/api/users/'+id,'PATCH',{status:'inactive'})).status===200);await logout();check('Inactive account cannot log in',(await request('/api/auth/login','POST',{email,password})).status===403);await login('admin');check('Admin reactivates user',(await request('/api/users/'+id,'PATCH',{status:'active'})).status===200);check('Administrator cannot be deactivated',(await request('/api/users/'+(await request('/api/session')).data.user.id,'PATCH',{status:'inactive'})).status===403);await logout();check('Reactivated account can log in',(await request('/api/auth/login','POST',{email,password})).status===200);await logout();check('Regular testing account logs in',(await login('user')).data?.user?.role==='user');await logout();
const rateEmail='rate-'+Date.now()+'@example.test';for(let i=0;i<8;i++)await request('/api/auth/login','POST',{email:rateEmail,password:'qa-only-invalid'});check('Repeated incorrect attempts are rate limited',(await request('/api/auth/login','POST',{email:rateEmail,password:'qa-only-invalid'})).status===429);window.qaPasswordResult={passed:checks.filter(x=>x.passed).length,total:checks.length,checks};out.textContent=JSON.stringify(window.qaPasswordResult,null,2);
}catch(e){out.textContent+='\nFAILED: '+e.message;}};
async function show(role){if(role==='login')await logout();else{const r=await login(role);if(r.status!==200){out.textContent=JSON.stringify(r);return}}frame.src='/?qa-preview='+Date.now()+(role==='admin'?'#/users':'');out.textContent='Showing '+role+' at '+frame.width+'px';}
document.querySelector('#ui-create').onclick=async()=>{try{await show('admin');out.textContent='Running UI account flow';const wait=(fn)=>new Promise((resolve,reject)=>{let count=0;const timer=setInterval(()=>{if(fn()){clearInterval(timer);resolve()}else if(++count>150){clearInterval(timer);reject(Error('UI result timed out'))}},100)});await wait(()=>frame.contentDocument?.querySelector('#add-user-form button[type=submit]:not(:disabled)'));const form=frame.contentDocument.querySelector('#add-user-form');const email='qa-ui-'+Date.now()+'@example.test',password='QA-UI-'+Math.random().toString(36).slice(2);form.elements.name.value='UI Form User';form.elements.email.value=email;form.elements.password.value=password;form.requestSubmit();await wait(()=>frame.contentDocument.querySelector('#toast')?.textContent.includes('Pengguna berhasil ditambahkan.'));const created=await request('/api/users');const row=created.data?.users.find(x=>x.email===email);if(!row)throw Error('User absent after form submission');await logout();frame.src='/';await wait(()=>frame.contentDocument?.querySelector('#login-form'));const loginForm=frame.contentDocument.querySelector('#login-form');loginForm.elements.email.value=email;loginForm.elements.password.value=password;loginForm.requestSubmit();await wait(()=>frame.contentDocument?.querySelector('#navigation'));if(frame.contentDocument.querySelector('a[href="#/users"]'))throw Error('User received admin navigation');out.textContent=JSON.stringify({uiFormCreate:true,newUserFormLogin:true,userAdminNavAbsent:true},null,2)}catch(e){out.textContent='UI FAILED: '+e.message}};
for(const role of ['login','admin','user'])document.querySelector('#'+role).onclick=()=>show(role);
</script></html>
