<!doctype html><html><meta charset="utf-8"><title>User menu QA</title><style>body{margin:0;background:#dce7ed;font:13px system-ui}header{padding:12px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,input,select{padding:8px 11px;border:1px solid #9db6c3;border-radius:9px;background:white}pre{white-space:pre-wrap;padding:12px 16px;max-height:160px;overflow:auto;margin:0}iframe{display:block;border:0;background:white}</style><header><b>LOCAL QA · actual app</b><button id="prepare">Prepare account</button><button id="edited">Check edited login</button><button id="inactive">Check inactive login</button><button id="active">Check active login</button><label>Email<input id="email" type="email"></label><label>Width<select id="width"><option>390</option><option>768</option><option selected>1071</option><option>1440</option></select></label><label>Page<select id="page"><option value="users">Users</option><option value="ranking">Ranking</option><option value="verification/EMP-0221">Verification</option><option value="detail/EMP-0221">Detail</option><option value="explain/EMP-0221">Explainability</option></select></label></header><pre id="out">Ready</pre><iframe id="preview" title="Actual PDUK-Radar" width="1071" height="1200"></iframe><script type="module">
const out=document.querySelector('#out'),frame=document.querySelector('#preview');let originalEmail,password,userId;
const call=async(path,method='GET',body)=>{const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},credentials:'same-origin',...(body?{body:JSON.stringify(body)}:{})});return {status:r.status,data:await r.json()}};
const logout=()=>call('/api/auth/logout','POST',{}),admin=()=>call('/api/auth/login','POST',{email:'admin@gmail.com',password:'admin'+'123'});
const show=()=>frame.src='/?menu-qa='+Date.now()+'#/users';
document.querySelector('#prepare').onclick=async()=>{await admin();const stamp=Date.now();originalEmail='menu-qa-'+stamp+'@example.test';password='QA-menu-'+Math.random().toString(36).slice(2);const created=await call('/api/users','POST',{name:'Menu QA User',email:originalEmail,password});userId=created.data?.user?.id;document.querySelector('#email').value=originalEmail;out.textContent=JSON.stringify({created:created.status===201,email:originalEmail,userId},null,2);show()};
for(const mode of ['edited','inactive','active'])document.querySelector('#'+mode).onclick=async()=>{const email=document.querySelector('#email').value;await logout();const login=await call('/api/auth/login','POST',{email,password});const result={mode,expectedStatus:mode==='inactive'?403:200,status:login.status,name:login.data.user?.name,error:login.data.error};if(login.status===200){result.userCannotList=(await call('/api/users')).status===403;result.userCannotEdit=(await call('/api/users/'+userId,'PATCH',{action:'edit',name:'Forbidden',email})).status===403;result.dataAccess=(await call('/api/data/employers.json')).status===200;if(mode==='edited'){await logout();result.oldEmailRejected=(await call('/api/auth/login','POST',{email:originalEmail,password})).status===401;}}await admin();out.textContent=JSON.stringify(result,null,2);show()};
document.querySelector('#width').onchange=e=>frame.width=e.target.value;
document.querySelector('#page').onchange=e=>frame.src='/?menu-page='+Date.now()+'#/'+e.target.value;
</script></html>
