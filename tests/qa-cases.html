<!doctype html><html><meta charset="utf-8"><title>PDUK case and spacing QA</title><style>body{margin:0;background:#dae4e9;font:13px system-ui}header{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{padding:8px 11px;border:1px solid #9fb7c3;border-radius:10px;background:white}pre{white-space:pre-wrap;max-height:220px;overflow:auto;padding:10px 16px;margin:0}iframe{display:block;border:0;background:white}</style><header><strong>LOCAL QA · actual app and D1</strong><button id="run">Run five scenarios</button><button id="login">Show login</button><button id="admin">Show admin</button><button id="user">Show user</button><label for="viewport">Viewport</label><select id="viewport"><option>390</option><option>768</option><option selected>1071</option><option>1440</option></select><label for="page">Page</label><select id="page"><option value="overview">Dashboard</option><option value="ranking">Ranking</option><option value="detail/EMP-0221">Detail</option><option value="explain/EMP-0221">Explainability</option><option value="verification/EMP-0221">Verification</option><option value="users">Users</option></select></header><pre id="out">Ready</pre><iframe id="preview" title="Actual PDUK-Radar" width="1071" height="1200"></iframe><script type="module">
const frame=document.querySelector('#preview'),out=document.querySelector('#out');const states=[];let initial,expected,qaEmail,qaPassword;const final=s=>s.startsWith('Verified ');const key={'Pending':'awaiting_review','Under Review':'in_progress','Need More Data':'awaiting_data','Verified Compliant':'completed_compliant','Verified Non-Compliant':'follow_up'};
const doc=()=>frame.contentDocument;
const wait=fn=>new Promise((resolve,reject)=>{let n=0;const t=setInterval(()=>{try{if(fn()){clearInterval(t);resolve()}}catch{}if(++n>200){clearInterval(t);reject(Error('App UI timed out'))}},60)});
const request=async(path,method='GET',body)=>{const r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||String(r.status));return data};
const login=role=>request('/api/auth/login','POST',{email:role+'@gmail.com',password:role+'123'});
const logout=()=>request('/api/auth/logout','POST',{});
const check=(name,ok)=>{states.push({name,passed:!!ok});out.textContent=JSON.stringify({passed:states.filter(x=>x.passed).length,total:states.length,checks:states},null,2);if(!ok)throw Error(name)};
const titles={overview:'Ringkasan risiko pemberi kerja',ranking:'Peringkat risiko perusahaan',detail:'Detail Risiko Perusahaan',explain:'Penjelasan Skor Risiko',verification:'Ruang kerja verifikasi',users:'Kelola pengguna'};
async function go(route,refresh=false){const page=route.split('/')[1].split('?')[0],id=route.split('/')[2]?.split('?')[0];if(refresh||!doc()?.querySelector('#main')){const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src='/?case-qa='+Date.now()+'#'+route;await loaded}else frame.contentWindow.location.hash=route;await wait(()=>doc()?.querySelector('#main h1')?.textContent===titles[page]&&(!id||page==='verification'?(!id||doc()?.querySelector('#verification-form')?.dataset.id===id):doc()?.querySelector('.profile-title h2')?.textContent===id));}
function counts(){const values=Object.values(expected);return Object.fromEntries(Object.keys(key).map(s=>[s,values.filter(v=>v===s).length]));}
function checkDashboard(tag){const d=doc(),c=counts();check(tag+' dashboard five verification counts',Object.entries(c).every(([s,n])=>+d.querySelector('[data-status="'+s+'"] strong')?.textContent===n));check(tag+' risk totals unchanged',d.querySelector('.kpi.total>strong')?.textContent==='500'&&d.querySelector('.kpi.critical>strong')?.textContent==='6'&&d.querySelector('.kpi.high>strong')?.textContent==='16'&&d.querySelector('.kpi.medium>strong')?.textContent==='109'&&d.querySelector('.kpi.low>strong')?.textContent==='369');check(tag+' case summaries match effective states',+d.querySelector('.case-stat.closed>strong')?.textContent===c['Verified Compliant']&&+d.querySelector('.case-stat.follow_up>strong')?.textContent===c['Verified Non-Compliant']);}
async function checkPages(id,status,tag){await go('/ranking?q='+id);await wait(()=>doc().querySelector('tr[data-employer="'+id+'"]'));let row=doc().querySelector('tr[data-employer="'+id+'"]');check(tag+' ranking separates verification and case',row.querySelector('[data-verification-status]')?.dataset.verificationStatus===status&&!row.querySelector('.case-badge'));for(const page of ['detail','explain']){await go('/'+page+'/'+id);const panel=doc();check(tag+' '+page+' shows the same result',doc().querySelector('.profile-status [data-verification-status]')?.dataset.verificationStatus===status&&panel.querySelector('[data-case-banner]')?.dataset.caseBanner===key[status]);const raw=doc().querySelector('.profile-score strong')?.textContent.split('/')[0].trim().replace(',','.');check(tag+' '+page+' preserves risk score',Math.abs(+raw-initial.find(r=>r.employer_id===id).risk_score)<.001);}
await go('/overview');checkDashboard(tag);await go('/verification/'+id);check(tag+' workspace status and case agree',doc().querySelector('.current-verification [data-verification-status]')?.dataset.verificationStatus===status&&doc().querySelector('[data-case-banner]')?.dataset.caseBanner===key[status]);const q=doc().querySelector('#queue-search');q.value=id;q.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));check(tag+' active queue excludes final results',!!doc().querySelector('.queue-list a')!==final(status));if(status==='Verified Non-Compliant'){doc().querySelector('[data-mode="follow_up"]').click();await wait(()=>doc().querySelector('.queue-tabs .selected')?.dataset.mode==='follow_up');check(tag+' non-compliant case appears in follow-up list',doc().querySelector('.queue-list [data-verification-status]')?.dataset.verificationStatus==='Verified Non-Compliant');}if(status==='Verified Compliant'){doc().querySelector('[data-mode="all"]').click();await wait(()=>doc().querySelector('.queue-tabs .selected')?.dataset.mode==='all');check(tag+' compliant case remains searchable in all cases',doc().querySelector('.queue-list [data-verification-status]')?.dataset.verificationStatus==='Verified Compliant');}}
async function save(id,status,reason=''){await go('/verification/'+id);const f=doc().querySelector('#verification-form');f.elements.status.value=status;f.elements.date.value=f.elements.date.max;f.elements.findingType.value='Klarifikasi simulasi '+id;f.elements.note.value='Hasil pemeriksaan QA untuk '+status+'.';f.elements.nextAction.value=status==='Need More Data'?'Lengkapi dokumen jumlah pekerja dan rekonsiliasi peserta.':status==='Verified Non-Compliant'?'Petugas meninjau temuan dan menyusun tindak lanjut.':'Catat hasil pemeriksaan simulasi dan monitor pembaruan.';if(f.elements.correctionReason){check('Final correction reason is required',f.elements.correctionReason.required&&!f.checkValidity());f.elements.correctionReason.value=reason}check('Required form fields valid before saving '+id,f.checkValidity());f.requestSubmit();await wait(()=>doc().querySelector('.current-verification [data-verification-status]')?.dataset.verificationStatus===status&&doc().querySelector('#toast')?.textContent.includes('berhasil disimpan'));expected[id]=status;}
document.querySelector('#run').onclick=async()=>{states.length=0;out.textContent='Running';try{await login('admin');qaEmail='verification-qa-'+Date.now()+'@example.test';qaPassword='QA-only-'+Math.random().toString(36).slice(2);await request('/api/users','POST',{name:'Verification QA',email:qaEmail,password:qaPassword});await logout();await request('/api/auth/login','POST',{email:qaEmail,password:qaPassword});const source=await request('/api/data/employers.json');initial=source.employers;expected=Object.fromEntries(initial.map(r=>[r.employer_id,r.verification_status]));const critical=initial.find(r=>r.employer_id==='EMP-0221'),high=initial.find(r=>r.risk_level==='High'&&!final(r.verification_status)),medium=initial.filter(r=>r.risk_level==='Medium'&&!final(r.verification_status)&&r.verification_status!=='Need More Data').sort((a,b)=>b.risk_score-a.risk_score)[0],pending=initial.find(r=>r.verification_status==='Pending'&&r.employer_id!==medium.employer_id);const scenarios=[[critical,'Verified Compliant'],[high,'Verified Non-Compliant'],[medium,'Need More Data'],[pending,'Under Review'],[critical,'Verified Non-Compliant','Koreksi berdasarkan klarifikasi simulasi tambahan.']];await go('/verification/'+critical.employer_id,true);for(let i=0;i<scenarios.length;i++){const [r,status,reason]=scenarios[i];await save(r.employer_id,status,reason);await checkPages(r.employer_id,status,'Scenario '+(i+1));await go('/verification/'+r.employer_id,true);await checkPages(r.employer_id,status,'Scenario '+(i+1)+' after refresh');if(i===4){check('Correction preserves both results and reason',doc().querySelectorAll('.timeline>li').length===2&&doc().querySelector('.timeline')?.textContent.includes(reason)&&!!doc().querySelector('.timeline [data-verification-status="Verified Compliant"]'));check('History contains timestamp and simulation actor',!!doc().querySelector('.timeline time')?.textContent.includes('WIB')&&doc().querySelector('.timeline')?.textContent.includes('Verification QA · Tanggal pemeriksaan'));}}await go('/verification/'+critical.employer_id);let ff=doc().querySelector('#followup-form');ff.elements.followUpStatus.value='Completed';ff.requestSubmit();await wait(()=>doc().querySelector('#followup-form .form-error')?.textContent);check('Closure requires a completion note',doc().querySelector('[data-case-banner]')?.dataset.caseBanner==='follow_up');ff.elements.closureNote.value='Tindak lanjut simulasi tuntas; dokumen diklarifikasi.';ff.requestSubmit();await wait(()=>doc().querySelector('[data-case-banner]')?.dataset.caseBanner==='follow_up_completed');check('Completed follow-up closes the case',true);await go('/verification/'+critical.employer_id,true);check('Closure survives refresh',doc().querySelector('#followup-form select')?.value==='Completed');doc().querySelector('[data-mode="closed"]').click();await wait(()=>doc().querySelector('.queue-tabs .selected')?.dataset.mode==='closed');check('Closed case appears in completed list',!!doc().querySelector('.queue-list a[href*="'+critical.employer_id+'"]'));await go('/verification/'+critical.employer_id);ff=doc().querySelector('#followup-form');ff.elements.followUpStatus.value='In Progress';ff.elements.reopenReason.value='Koreksi simulasi membutuhkan pemeriksaan tambahan.';ff.requestSubmit();await wait(()=>doc().querySelector('[data-case-banner]')?.dataset.caseBanner==='follow_up');check('Reasoned reopening restores follow-up queue',true);await go('/verification/'+critical.employer_id);doc().querySelector('[data-action="confirm-reset"]').click();await wait(()=>doc().querySelector('dialog[open]'));doc().querySelector('[data-action="reset-demo"]').click();await wait(()=>doc().querySelector('.current-verification [data-verification-status]')?.dataset.verificationStatus===critical.verification_status);expected=Object.fromEntries(initial.map(r=>[r.employer_id,r.verification_status]));check('Reset restores original verification status and clears history',doc().querySelectorAll('.timeline>li').length===0);await go('/overview');checkDashboard('After reset');await go('/verification/'+critical.employer_id,true);check('Reset persists after refresh',doc().querySelector('.current-verification [data-verification-status]')?.dataset.verificationStatus===critical.verification_status&&doc().querySelectorAll('.timeline>li').length===0);out.textContent=JSON.stringify({passed:states.filter(x=>x.passed).length,total:states.length,checks:states,scenarios:scenarios.map(([r,status])=>({id:r.employer_id,risk:r.risk_level,status})),localOnly:true},null,2)}catch(e){out.textContent+='\nFAILED: '+e.message}};
for(const role of ['login','admin','user'])document.querySelector('#'+role).onclick=async()=>{try{if(role==='login'){await logout();frame.src='/?qa-login='+Date.now()}else{await login(role);await go(role==='admin'?'/users':'/overview',true)}out.textContent='Showing '+role}catch(e){out.textContent=e.message}};
document.querySelector('#viewport').onchange=e=>frame.width=e.target.value;document.querySelector('#page').onchange=e=>go('/'+e.target.value);
</script></html>
